name: Deploy to Vercel Production

# Force every push to `main` to become a PRODUCTION deployment on Vercel.
# Prevents the "stuck on old version" bug where auto-promote was silently off.
#
# Required repo secrets (set once in GitHub → Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN       : personal access token from https://vercel.com/account/tokens
#   - VERCEL_ORG_ID      : team_SrDWY44Jj4C9PoI02fpgXfua
#   - VERCEL_PROJECT_ID  : prj_ApUa3ici5toPdS9tPuRnwczPYWge

on:
  push:
    branches: [main]

permissions:
  contents: read

# Prevent concurrent production deploys — newer push cancels older in-flight one
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-fund

      - name: Verify lint, tests, and build
        run: npm run lint && npm test && npm run build

      - name: Security audit
        shell: bash
        run: |
          set +e
          timeout 90s npm audit --audit-level=high
          audit_status=$?
          set -e

          if [ "$audit_status" -eq 124 ]; then
            echo "::warning::Registry audit timed out; checking the local advisory cache instead."
            npm audit --audit-level=high --offline
          else
            exit "$audit_status"
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy + promote to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
