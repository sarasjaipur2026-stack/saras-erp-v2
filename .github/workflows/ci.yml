name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Security audit
        shell: bash
        run: |
          set +e
          timeout 90s npm audit --audit-level=high
          audit_status=$?
          set -e

          if [ "$audit_status" -eq 124 ]; then
            echo "::warning::Registry audit timed out; checking the local advisory cache instead."
            npm audit --audit-level=high --offline
          else
            exit "$audit_status"
          fi
