name: Daily business E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'

concurrency:
  group: daily-business-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium --with-deps
      - name: Verify every daily-business screen and critical links
        env:
          BASE_URL: ${{ vars.PROD_URL || 'https://saras-erp-v2-rebuild.vercel.app' }}
          SARAS_TEST_EMAIL: ${{ secrets.SARAS_TEST_EMAIL }}
          SARAS_TEST_PASSWORD: ${{ secrets.SARAS_TEST_PASSWORD }}
        run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-e2e-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
